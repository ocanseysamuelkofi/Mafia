<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAFIA</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR CODE LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<header class="topbar">

    <div class="logo">
        MAFIA
    </div>

    <div class="mode-buttons">

        <button onclick="showView('screen')">
            📺 Screen
        </button>

        <button onclick="showView('player')">
            🎮 Player
        </button>

        <button onclick="showView('moderator')">
            🛡️ Moderator
        </button>

    </div>

</header>


<!-- =====================================================
     PUBLIC SCREEN
====================================================== -->

<section id="screen-view" class="view active">

    <div id="screen-content">

        <div class="screen-lobby">

            <h1>MAFIA</h1>

            <p class="screen-subtitle">
                Scan the QR code to join the game
            </p>

            <div class="qr-wrapper">

                <div id="qrcode"></div>

            </div>

            <div class="game-code">
                GAME CODE:
                <strong id="display-game-code">
                    MAFIA123
                </strong>
            </div>

            <div id="screen-player-count">
                Waiting for players...
            </div>

            <div id="screen-player-list">
            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     PLAYER PHONE
====================================================== -->

<section id="player-view" class="view">

    <div class="phone">

        <div class="phone-top">

            <strong>MAFIA</strong>

            <span>
                ● ONLINE
            </span>

        </div>

        <div id="player-content">

            <div class="player-page">

                <div class="player-icon">
                    🎮
                </div>

                <h2>Join Game</h2>

                <p>
                    Enter your name to join.
                </p>

                <input
                    id="player-name"
                    type="text"
                    maxlength="20"
                    placeholder="Your name"
                    autocomplete="off"
                >

                <button
                    class="big-button"
                    onclick="joinGame()"
                >
                    JOIN GAME
                </button>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     MODERATOR
====================================================== -->

<section id="moderator-view" class="view">

    <div class="moderator-container">

        <div class="moderator-title">

            <div>

                <h1>
                    Moderator Panel
                </h1>

                <p>
                    Control the Mafia game.
                </p>

            </div>

            <span class="secret-label">
                🔒 SECRET
            </span>

        </div>

        <div id="moderator-content">

        </div>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
